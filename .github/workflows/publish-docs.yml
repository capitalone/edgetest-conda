# This workflow builds and publishes the latest docs to
# the `gh-pages` branch.
# For more details: https://github.com/marketplace/actions/deploy-to-github-pages
name: Publish docs

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
    - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # pin@v2
      with:
        # fetch all tags so `versioneer` can properly determine current version
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@e9aba2c848f5ebd159c070c61ea2c4e2b122355e # pin@v2
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: python -m pip install .[dev]
    - name: Build
      run: make sphinx
      shell: bash
    - name: Publish
      uses: JamesIves/github-pages-deploy-action@049a95c516cd5723d8cfde79dc7a79fcdcbd6c97 # pin@4.0.0
      with:
        branch: gh-pages
        folder: docs/_build/html
