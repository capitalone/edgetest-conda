[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "edgetest-conda"
description = "Conda edgetest plugin"
readme = "README.md"
requires-python = ">=3.10.0"
dynamic = ["version"]
authors = [{ name = "Akshay Gupta", email = "akshay.gupta2@capitalone.com" }]
maintainers = [{ name = "Akshay Gupta", email = "akshay.gupta2@capitalone.com" }]
classifiers = [
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = ["edgetest>=2026.4.0"]

[project.optional-dependencies]
docs = [
    "furo",
    "sphinx",
    "sphinx-copybutton",
    "sphinx-tabs",
]
tests = [
    "coverage",
    "flake8",
    "mypy",
    "pydocstyle",
    "pytest",
    "pytest-cov",
]
qa = [
    "black",
    "isort",
    "pip-tools",
    "pre-commit",
    "pylint",
]
build = [
    "build",
    "twine",
    "wheel",
    "bumpver",
]
dev = [
    "coverage",
    "flake8",
    "mypy",
    "pydocstyle",
    "pytest",
    "pytest-cov",
    "furo",
    "sphinx",
    "sphinx-copybutton",
    "sphinx-tabs",
    "black",
    "isort",
    "pip-tools",
    "pre-commit",
    "pylint",
    "build",
    "twine",
    "wheel",
    "bumpver",
]

[project.entry-points.edgetest]
conda = "edgetest_conda.plugin"

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.packages.find]

[tool.setuptools.dynamic]
version = { attr = "edgetest_conda.__version__" }

[tool.edgetest]

[[tool.edgetest.env]]
name = "core"
python_version = "3.12"
upgrade = [
    "edgetest",
]
extras = [
    "tests",
]
deps = [
    "pip-tools",
]

[tool.bumpver]
current_version = "2026.4.0"
version_pattern = "YYYY.MM.INC0"
commit_message = "Bump {old_version} to {new_version}"
commit = true

[tool.bumpver.file_patterns]
"pyproject.toml" = [
    'current_version = "{version}"',
]
"docs/source/conf.py" = [
    'version = "{version}"',
]
"edgetest_conda/__init__.py" = [
    '__version__ = "{version}"',
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
allow_redefinition = true

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
line_length = 88

[tool.pytest.ini_options]
markers = [
    "unit: mark unit tests that do not require external interfaces and use mocking",
    "integration: mark test that interact with an external system",
]
addopts = "--verbose"
